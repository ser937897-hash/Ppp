# FreeLLMAPI — https://github.com/tashfeenahmed/freellmapi (MIT)
# One OpenAI/Anthropic-compatible /v1 endpoint over ~34 free LLM provider tiers.
# Start with ./start.sh (creates .env with an encryption key on first run).
services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
    # Localhost only: FreeLLMAPI is single-user and must not be exposed to the
    # internet. Set HOST_BIND=0.0.0.0 in .env to reach it from a trusted LAN.
    ports:
      - "${HOST_BIND:-127.0.0.1}:${PORT:-3001}:3001"
    volumes:
      - freellmapi-data:/app/server/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ping').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  freellmapi-data:
